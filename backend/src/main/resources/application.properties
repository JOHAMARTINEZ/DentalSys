spring.application.name=backend

# Host y puerto se pueden cambiar en .env (DB_HOST, DB_PORT). Docker usa el puerto 3307.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/dentalsys_v2?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&tinyInt1isBit=false
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Los Boolean de Java se guardan como TINYINT (-6 = codigo JDBC de TINYINT)
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=-6

# Incluye el mensaje de error del backend en la respuesta
# (ej: "El odontologo seleccionado no atiende en esa sucursal"),
# para que el frontend pueda mostrarselo al paciente.
server.error.include-message=always

# Asistente de IA (Google Gemini). La clave va en el archivo .env (GEMINI_API_KEY).
# Si no esta definida, el asistente queda desactivado y el resto del sistema funciona igual.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

logging.level.org.springframework.security=DEBUG