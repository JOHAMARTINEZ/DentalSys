spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/dentalsys_v2?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&tinyInt1isBit=false
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Los Boolean de Java se guardan como TINYINT (-6 = codigo JDBC de TINYINT)
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=-6

# Incluye el mensaje de error del backend en la respuesta
# (ej: "El odontologo seleccionado no atiende en esa sucursal"),
# para que el frontend pueda mostrarselo al paciente.
server.error.include-message=always

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

logging.level.org.springframework.security=DEBUG